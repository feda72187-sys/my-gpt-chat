<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human GPT</title>
    <style>
        body { 
            background-color: #343541; 
            color: #ececf1; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            margin: 0; 
        }

        #chat { 
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
        }

        .message-row {
            padding: 24px 15%;
            display: flex;
            gap: 20px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .user-row { background-color: #343541; }
        .admin-row { background-color: #444654; }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .user-row .avatar { background-color: #5436da; }
        .admin-row .avatar { background-color: #10a37f; }

        .text { line-height: 1.5; font-size: 16px; word-break: break-word; }

        .input-area {
            padding: 20px 15% 40px 15%;
            background: #343541;
        }

        .input-box {
            display: flex;
            background: #40414f;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 10px;
            font-size: 16px;
            outline: none;
        }

        button {
            background: #10a37f;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="chat"></div>

    <div class="input-area">
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Спросите меня о чем-нибудь...">
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <!-- Загрузка библиотеки Ably -->
   <script src="https://ably.com"></script>
    
    <script>
        // ЗАМЕНИ ЭТУ СТРОЧКУ НА СВОЙ КЛЮЧ:
        const MY_API_KEY = 'e4Ps2w.-kRDKA:HCXcXQA_6CW5FRusVr_J36GAOYVaEvySsMTIurOBXas';

        const ably = new Ably.Realtime(MY_API_KEY);
        const channel = ably.channels.get('chat-room');
        const chatDiv = document.getElementById('chat');
        const input = document.getElementById('userInput');
        const btn = document.getElementById('sendBtn');

        // Проверка подключения
        ably.connection.on('connected', () => {
            console.log('Успешно подключено к серверу!');
        });

        // Слушаем сообщения (и свои, и чужие)
        channel.subscribe('message', (msg) => {
            const isGPT = msg.data.sender === 'Admin';
            const row = document.createElement('div');
            row.className = 'message-row ' + (isGPT ? 'admin-row' : 'user-row');
            
            row.innerHTML = `
                <div class="avatar">${isGPT ? 'AI' : 'U'}</div>
                <div class="text">${msg.data.text}</div>
            `;
            
            chatDiv.appendChild(row);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        });

        // Функция отправки
        function sendMsg() {
            const text = input.value.trim();
            if (!text) return;

            console.log('Отправка...');
            channel.publish('message', { 
                text: text, 
                sender: 'User' 
            }, (err) => {
                if (err) alert('Ошибка: ' + err.message);
            });

            input.value = '';
        }

        // Привязка к кнопке и Enter
        btn.addEventListener('click', sendMsg);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMsg();
        });
    </script>
</body>
</html>
