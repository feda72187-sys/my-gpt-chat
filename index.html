<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Human GPT Chat</title>
    <!-- Прямое подключение библиотеки через надежный сервис -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { background: #343541; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .msg { margin: 10px 0; padding: 12px 18px; border-radius: 15px; max-width: 80%; line-height: 1.4; background: #444654; }
        .admin { background: #10a37f; align-self: flex-end; }
        .user { align-self: flex-start; }
        .input-box { padding: 20px; background: #343541; border-top: 1px solid #555; display: flex; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #555; background: #40414f; color: white; outline: none; }
        button { background: #10a37f; color: white; border: none; padding: 0 25px; margin-left: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div class="input-box">
        <input type="text" id="inp" placeholder="Напишите сообщение...">
        <button id="btn">ОТПРАВИТЬ</button>
    </div>

    <script>
       
        const startChat = () => {
            const key = 'e4Ps2w.-kRDKA:HCXcXQA_6CW5FRusVr_J36GAOYVaEvySsMTIurOBXas';
            const ably = new Ably.Realtime(key);
            const channel = ably.channels.get('main-chat');

            channel.subscribe('msg', (m) => {
                const div = document.createElement('div');
                div.className = 'msg ' + (m.data.role === 'admin' ? 'admin' : 'user');
                div.innerText = (m.data.role === 'admin' ? 'ИИ: ' : 'Вы: ') + m.data.txt;
                document.getElementById('chat').appendChild(div);
                document.getElementById('chat').scrollTop = 999999;
            });

            const send = () => {
                const input = document.getElementById('inp');
                if (!input.value.trim()) return;
                channel.publish('msg', { txt: input.value, role: 'user' });
                input.value = '';
            };

            document.getElementById('btn').onclick = send;
            document.getElementById('inp').onkeypress = (e) => { if (e.key === 'Enter') send(); };
            console.log("Система готова!");
        };

        // Проверка загрузки
        if (window.Ably) {
            startChat();
        } else {
            // Если через CDN не вышло, пробуем подождать
            setTimeout(() => { if (window.Ably) startChat(); else alert("Библиотека не загрузилась. Проверьте интернет!"); }, 2000);
        }
    </script>
</body>
</html>
